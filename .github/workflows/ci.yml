name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          # One representative run per OS beyond Linux keeps CI quick.
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest --cov=ledgerlens --cov-report=term-missing

      - name: Fixtures are reproducible
        # The generator is seeded, so regenerating must be a no-op. If this
        # fails, the fixtures and the generator have drifted apart.
        run: |
          python tests/fixtures/generate.py
          git diff --exit-code -- tests/fixtures

  no-real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject anything that looks like a real statement
        run: |
          if git ls-files | grep -Ei '\.(ofx|qfx|qif)$|(statement|activity|export).*\.csv$'; then
            echo "::error::A file that looks like real financial data is tracked in this repo."
            exit 1
          fi
          echo "No real financial data found."
