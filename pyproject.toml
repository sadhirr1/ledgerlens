[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledgerlens"
version = "0.1.0"
description = "A local-first MCP server that turns messy bank statement exports into queryable spending data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sadhir" }]
keywords = ["mcp", "model-context-protocol", "finance", "csv", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    # Only used to build the PDF fixtures and to exercise the failure paths;
    # not needed to run the server.
    "reportlab>=4.0",
    "pypdf>=4.0",
]

[project.scripts]
ledgerlens = "ledgerlens.__main__:main"

[project.urls]
Homepage = "https://github.com/sadhirr1/ledgerlens"
Issues = "https://github.com/sadhirr1/ledgerlens/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
